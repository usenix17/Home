all:
  children:
    routers:
      hosts:
        odin.starnix.net:

    desktops:
      hosts:
        selene.starnix.net:
      vars:
        ansible_python_interpreter: "/usr/bin/python3"

    servers:
      children:
        py3_servers:
          hosts:
            bork.starnix.net:
            3cx.starnix.net:
            hecate.starnix.net:
            print.starnix.net:
            sky.starnix.net:
              ansible_user: "astro"
              ansible_ssh_pass: "{{ sky_pass }}"
              ansible_become_pass: "{{ sky_pass }}"
            virt.starnix.net:

    macs:
      hosts:
        gnome.starnix.net:
          ansible_ssh_pass: "{{ gnome_pass }}"
          ansible_become_pass: "{{ gnome_pass }}"
        finnmac.starnix.net:

    freebsd:
      hosts:
        beastyboi.starnix.net:
        freebsd15.starnix.net:
        mimir.starnix.net:
      vars:
        ansible_python_interpreter: "/usr/local/bin/python3"
        ansible_shell_executable: "/bin/sh"

    # mimir is also in `freebsd` above (for the interpreter/shell vars); this
    # group is what the storage plays (nfs/zfs/smartd/minio/graylog/certbot)
    # target and what binds group_vars/storage.yml.
    storage:
      hosts:
        mimir.starnix.net:

    # Hosts running the Wazuh agent that the wazuh_agent role manages
    # (FreeBSD/Debian/Arch). macOS, OmniOS, and the router run agents too but are
    # not yet covered by the role, so they stay hand-managed and are omitted here.
    wazuh_agents:
      hosts:
        mimir.starnix.net:
        beastyboi.starnix.net:
        freebsd15.starnix.net:
        bork.starnix.net:
        hecate.starnix.net:
        vault.starnix.net:
        selene.starnix.net:

    omnios:
      hosts:
        omnios.starnix.net:
      vars:
        ansible_python_interpreter: "/usr/bin/python3"
        ansible_become_method: pfexec
        # illumos pfexec only takes "pfexec [-P privset] cmd [arg..]"; it rejects
        # the sudo default flags (-H -S -n). Run the command through a shell so the
        # become plugin emits: pfexec /bin/sh -c '<cmd>'
        ansible_become_flags: "/bin/sh -c"

    proxmox:
      hosts:
        pve1.starnix.net:
        pve2.starnix.net:
        pve3.starnix.net:
        pve4.starnix.net:
        pve5.starnix.net:

    iron:
      hosts:
        bork.starnix.net:
          server: true
        hecate.starnix.net:
          server: true

  vars:
    ansible_ssh_common_args: "-o ControlMaster=auto -o ControlPersist=60m -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no -o LogLevel=QUIET"
    ansible_user: "cloud"
    ansible_ssh_pass: "{{ become_pass }}"
    ansible_become: true
    ansible_become_method: "sudo"
    ansible_become_user: "root"
    ansible_become_pass: "{{ become_pass }}"
