---
# Group vars for the `storage` group (mimir.starnix.net).
#
# The MinIO root password is a secret. Provide `vault_minio_root_password`
# via ansible-vault -- either encrypt THIS file:
#     ansible-vault encrypt inventory/group_vars/storage.yml
# or keep it in a separate encrypted vault file loaded for this group.
#
# Example (encrypt before committing):
#   vault_minio_root_password: "<the real MinIO root password>"
#   vault_certbot_cloudflare_api_token: "<Cloudflare API token>"
#   vault_graylog_password_secret: "<the OLD graylog password_secret>"
#   vault_graylog_root_password_sha2: "<intended admin sha256 hash>"
#   vault_smartd_discord_webhook: "<Discord webhook URL for smartd alerts>"

# Non-secret MinIO overrides can go here if you need to diverge from the
# role defaults (roles/bastille_minio/defaults/main.yml), e.g.:
# minio_jail_ip: "192.168.1.150"
# bastille_zfs_zpool: "Store"
