name: UniFi firewall via Semaphore

# Runs the SemaphoreUI "UniFi firewall" task (project 1 / template 3), which
# runs the Ansible reconciler (playbooks/unifi_firewall.yml) against the UDM.
# Triggered on merge to main when the role or playbook changes, and on manual
# dispatch. Semaphore is reached over the public Cloudflare tunnel
# (semaphore.starnix.net); auth is the SEMAPHORE_TOKEN repo secret.
on:
  push:
    branches: [main]
    # Only fire when the firewall-as-code itself changes.
    paths:
      - 'roles/unifi_firewall/**'
      - 'playbooks/unifi_firewall.yml'
      - '.github/workflows/unifi-semaphore.yml'
  workflow_dispatch:     # manual run from the Actions tab

# Don't stack concurrent reconciles against the controller.
concurrency:
  group: unifi-firewall-semaphore
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger + wait for Semaphore task
        env:
          TOKEN: ${{ secrets.SEMAPHORE_TOKEN }}
        run: |
          set -euo pipefail
          API="https://semaphore.starnix.net/api/project/1"

          echo "Starting Semaphore template 3 (UniFi firewall)…"
          resp=$(curl -sfS -X POST "$API/tasks" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"template_id": 3}')
          id=$(echo "$resp" | jq -r '.id')
          echo "Started task #$id — https://semaphore.starnix.net/project/1/history?t=$id"

          # Poll until the task reaches a terminal state; fail the Action if it errors.
          for i in $(seq 1 90); do
            sleep 10
            status=$(curl -sfS "$API/tasks/$id" -H "Authorization: Bearer $TOKEN" | jq -r '.status')
            echo "  task #$id: $status"
            case "$status" in
              success)                exit 0 ;;
              error|stopped|failed)   echo "::error::Semaphore task #$id ended: $status"; exit 1 ;;
            esac
          done
          echo "::error::timed out waiting for Semaphore task #$id"
          exit 1
