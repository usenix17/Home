---
# Deploy the Graylog server jail (Graylog + MongoDB + OpenSearch) on mimir.
# NOTE: distinct from playbooks/graylog.yml, which configures rsyslog CLIENTS to
# forward logs TO Graylog.
#
# Prereqs: FreeBSD 15 host with Bastille; graylog data pre-staged on datasets
# (Phase 0); vault_graylog_password_secret + vault_graylog_root_password_sha2 set.

- name: "Graylog server jail on mimir"
  hosts: "storage"
  become: true
  roles:
    - role: "bastille_graylog"
