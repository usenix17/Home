---
# UniFi "everything as code" via the starnix.unifi collection.
#
# Manages the zone-based firewall (groups, zones, policies, ordering), networks,
# and per-network DHCP options in a SINGLE starnix.unifi.unifi_reconcile call.
# The vars under vars/unifi_iac/ are name-based -- there are no UUIDs; the module
# fetches each collection once, resolves every cross-reference from its name, and
# writes only the drift. Reverse-engineered from the live controller, so a run is
# a no-op; edit the vars to change config.
#
#   UNIFI_API_KEY=... ansible-playbook playbooks/unifi_iac.yml --check --diff
#   UNIFI_API_KEY=... ansible-playbook playbooks/unifi_iac.yml
#
# This is the sole source of truth for the firewall (the v2 reconciler was
# retired). Check-mode (--check) never writes and is always safe.
- name: UniFi as code
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars_files:
    - vars/unifi_iac/main.yml
    - vars/unifi_iac/groups.yml
    - vars/unifi_iac/zones.yml
    - vars/unifi_iac/networks.yml
    - vars/unifi_iac/policies.yml
    - vars/unifi_iac/ordering.yml
    - vars/unifi_iac/dhcp.yml
  tasks:
    - name: Reconcile the entire UniFi state in one call
      starnix.unifi.unifi_reconcile:
        host: "{{ unifi_host }}"
        api_key: "{{ unifi_api_key }}"
        validate_certs: "{{ unifi_validate_certs }}"
        groups: "{{ unifi_groups }}"
        zones: "{{ unifi_zones }}"
        networks: "{{ unifi_networks }}"
        policies: "{{ unifi_policies }}"
        ordering: "{{ unifi_ordering }}"
        dhcp: "{{ unifi_dhcp }}"
      register: unifi_result

    - name: Show what changed
      ansible.builtin.debug:
        var: unifi_result.changes
      when: unifi_result.changes | default([]) | length > 0
