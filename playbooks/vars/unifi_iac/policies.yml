# policies.yml -- generated from the live controller by discover_unifi_iac.py.
# Names only; cross-references resolve at play time via the *_ids maps
# that unifi_iac.yml builds. Matched by name -- edit values freely.
unifi_policies:
- name: Allow all nebula (Internal->Internal)
  enabled: true
  description: iac:allow-all-nebula-3
  action:
    type: ALLOW
    allowReturnTraffic: false
  source:
    zoneId: '{{ zone_ids[''Internal''] }}'
    trafficFilter:
      type: IP_ADDRESS
      ipAddressFilter:
        type: TRAFFIC_MATCHING_LIST
        matchOpposite: false
        trafficMatchingListId: '{{ list_ids[''Nebula''] }}'
  destination:
    zoneId: '{{ zone_ids[''Internal''] }}'
  ip_protocol_scope:
    ipVersion: IPV4
  logging_enabled: false
