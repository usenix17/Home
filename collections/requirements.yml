---
# Ansible Galaxy collection requirements.
#
# Auto-installed by SemaphoreUI (and `ansible-galaxy collection install -r
# collections/requirements.yml`) before any play runs. This file lives at
# collections/requirements.yml on purpose: that is the path Semaphore and the
# standard Ansible layout look for. Root-level requirements.yml is NOT read by
# Semaphore, which is why playbooks/unifi_iac.yml could not resolve
# starnix.unifi.unifi_reconcile in CI.
#
# Installs land in the ansible.cfg collections_path (.ansible/collections), the
# same path the playbooks resolve at run time.
collections:
  - name: ansible.netcommon
  - name: ansible.posix
  - name: ansible.utils
  - name: ansible.windows
  - name: community.crypto
  - name: community.general
  - name: community.mysql
  - name: community.network
  - name: community.windows
  - name: freeipa.ansible_freeipa
  - name: kubernetes.core
  - name: kewlfft.aur
  - name: google.cloud
  # UniFi zone-firewall + networks + DHCP as code (see playbooks/unifi_iac.yml).
  # NOTE: Semaphore only runs `ansible-galaxy install` when this file changes; if
  # the runner loses its installed collections (ephemeral/rebuilt runner), a run
  # fails with "No module named 'ansible_collections.starnix'". Touch this file
  # (bump the comment below) to force a reinstall.
  # galaxy-reinstall-nonce: 2026-09-05.1
  - name: https://github.com/usenix17/starnix.unifi.git
    type: git
    version: main
