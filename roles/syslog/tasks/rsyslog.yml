---
# Linux + OmniOS: rsyslog forwards everything to Graylog via a drop-in. The base
# /etc/rsyslog.conf is left intact (it already includes /etc/rsyslog.d/*.conf).

- name: "Install rsyslog"
  ansible.builtin.package:
    name: rsyslog
    state: present
  become: true

# log.starnix.net (the old syslog target) is decommissioned -- strip its leftover
# forwarding config so hosts stop trying to reach a host that no longer exists.
- name: "Remove retired log.starnix.net forwarding drop-in"
  ansible.builtin.file:
    path: /etc/rsyslog.d/50-forwarding.conf
    state: absent
  become: true
  notify: restart rsyslog

- name: "Strip retired log.starnix.net forwarding line from rsyslog.conf"
  ansible.builtin.lineinfile:
    path: /etc/rsyslog.conf
    regexp: '@log\.starnix\.net'
    state: absent
  become: true
  notify: restart rsyslog

# illumos/OmniOS: the native system-log (syslogd) owns /dev/log; it must yield to
# rsyslog or the two daemons conflict. Stop/disable it where present (no-op else).
- name: "Disable native system-log on illumos (rsyslog takes over)"
  ansible.builtin.service:
    name: system/system-log
    state: stopped
    enabled: false
  become: true
  when: ansible_system == 'SunOS'
  failed_when: false

- name: "Forward all logs to Graylog (rsyslog drop-in)"
  ansible.builtin.template:
    src: rsyslog-graylog.conf.j2
    dest: /etc/rsyslog.d/50-graylog.conf
    mode: "0644"
    owner: root
    group: root
  become: true
  notify: restart rsyslog

- name: "Enable and start rsyslog"
  ansible.builtin.service:
    name: rsyslog
    state: started
    enabled: true
  become: true
