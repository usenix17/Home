---
# Forward all system logs to the central Graylog server (graylog.starnix.net:1514/udp).
# rsyslog on Linux + OmniOS (illumos); native syslogd on FreeBSD.

- name: "Forward syslog via rsyslog (Linux / OmniOS)"
  ansible.builtin.include_tasks: rsyslog.yml
  when: ansible_system in ['Linux', 'SunOS']

- name: "Forward syslog via native syslogd (FreeBSD)"
  ansible.builtin.include_tasks: freebsd.yml
  when: ansible_system == 'FreeBSD'
