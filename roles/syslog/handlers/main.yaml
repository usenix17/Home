---

- name: restart rsyslog
  ansible.builtin.service:
    name: rsyslog
    state: restarted
  become: true

- name: reload syslogd
  ansible.builtin.service:
    name: syslogd
    state: reloaded
  become: true

- name: restart rsyslogd
  ansible.builtin.service:
    name: rsyslogd
    state: restarted
  become: true
