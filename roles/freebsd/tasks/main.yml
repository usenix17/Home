---

- name: "Enroll host in FreeIPA"
  ansible.builtin.import_role:
    name: ipa-enroll
  vars:
    ipa_keytab_group: wheel

# --- Package installation ---

- name: "Create pkg repos config directory"
  ansible.builtin.file:
    path: /usr/local/etc/pkg/repos
    state: directory
    mode: "0755"
    owner: root
    group: wheel

- name: "Standardize pkg repos on the 'latest' branch (single ports repo)"
  ansible.builtin.copy:
    dest: /usr/local/etc/pkg/repos/FreeBSD.conf
    # Overrides the base /etc/pkg/FreeBSD.conf, which on FreeBSD 15 ships the
    # ports tree as FreeBSD-ports=quarterly. We point that (and kmods) at
    # 'latest' and retire the pre-FreeBSD-15 'FreeBSD' repo name -- otherwise
    # both quarterly and latest copies of the ports tree are enabled at once
    # and their package versions conflict.
    content: |
      FreeBSD-ports: {
        url: "pkg+https://pkg.FreeBSD.org/${ABI}/latest",
        mirror_type: "srv",
        signature_type: "fingerprints",
        fingerprints: "/usr/share/keys/pkg",
        enabled: yes
      }
      FreeBSD-ports-kmods: {
        url: "pkg+https://pkg.FreeBSD.org/${ABI}/kmods_latest_${VERSION_MINOR}",
        mirror_type: "srv",
        signature_type: "fingerprints",
        fingerprints: "/usr/share/keys/pkg",
        enabled: yes
      }
      FreeBSD: { enabled: no }
    mode: "0644"
    owner: root
    group: wheel

# --- pkgbase ---
# The base system is managed as FreeBSD-* packages (pkgbase), not by
# freebsd-update. FreeBSD 15's /etc/pkg/FreeBSD.conf already defines the
# FreeBSD-base repo; pin it enabled here with exactly what pkgbasify writes,
# so converted hosts don't drift and a stock default can't turn it off.
- name: "Enable the FreeBSD-base (pkgbase) repo"
  ansible.builtin.copy:
    dest: /usr/local/etc/pkg/repos/FreeBSD-base.conf
    content: |
      FreeBSD-base: {
        enabled: yes
      }
    mode: "0644"
    owner: root
    group: wheel

# Keep copies of replaced shared libraries across base upgrades (pkgbasify
# sets this too) so running binaries survive a libc/lib* swap.
- name: "Keep backup libraries for pkgbase upgrades"
  ansible.builtin.lineinfile:
    path: /usr/local/etc/pkg.conf
    regexp: "^#?\\s*BACKUP_LIBRARIES"
    line: "BACKUP_LIBRARIES=yes"
    create: true
    mode: "0644"
    owner: root
    group: wheel

- name: "Update pkg cache"
  ansible.builtin.command: pkg update -f
  changed_when: false

# Converting reinstalls the whole base system, so it is never automated:
# fail the host with instructions instead. pkgbasify uses the same check.
- name: "Check that the base system is managed by pkgbase"
  ansible.builtin.command: pkg which -q /usr/bin/uname
  register: freebsd_pkgbase_check
  changed_when: false
  failed_when: false
  when: freebsd_require_pkgbase | bool

- name: "Require pkgbase"
  ansible.builtin.assert:
    that: freebsd_pkgbase_check.rc == 0
    fail_msg: >-
      {{ inventory_hostname }} is not on pkgbase (base files are not owned by
      FreeBSD-* packages). Finish any pending freebsd-update, then convert with
      pkgbasify (https://github.com/FreeBSDFoundation/pkgbasify) and reboot.
      Set freebsd_require_pkgbase=false to skip this check.
    quiet: true
  when: freebsd_require_pkgbase | bool

# Reconcile any packages still on the old branch onto 'latest' (a host that ran
# the previous dual-repo config has a quarterly/latest mix that conflicts).
- name: "Reconcile installed packages onto the latest branch"
  ansible.builtin.command: pkg upgrade -y
  register: pkg_reconcile
  changed_when: "'Your packages are up to date' not in pkg_reconcile.stdout"

- name: "Install FreeIPA client packages"
  community.general.pkgng:
    name:
      - sssd2
      - dbus
      - bash
      - pam_mkhomedir
      - openldap26-client
      - ca_root_nss
    state: present

# --- Directory structure ---

- name: "Create required directories"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
    owner: root
    group: wheel
  loop:
    - /usr/local/etc/ipa
    - /usr/local/etc/sssd
    - /usr/local/etc/krb5.conf.d

# --- CA certificate ---

- name: "Fetch IPA CA certificate"
  ansible.builtin.get_url:
    url: http://{{ ipa_server }}/ipa/config/ca.crt
    dest: /usr/local/etc/ipa/ca.crt
    mode: "0644"
    owner: root
    group: wheel
  notify: rehash-certs

- name: "Install IPA CA cert into system trust store"
  ansible.builtin.copy:
    src: /usr/local/etc/ipa/ca.crt
    dest: /usr/local/share/certs/starnix-ipa-ca.crt
    remote_src: true
    mode: "0644"
    owner: root
    group: wheel
  notify: rehash-certs

# --- Kerberos ---

- name: "Copy freeipa kerberos config"
  ansible.builtin.copy:
    src: freeipa
    dest: /usr/local/etc/krb5.conf.d/freeipa
    mode: "0644"
    owner: root
    group: wheel

- name: "Copy localauth plugin config"
  ansible.builtin.copy:
    src: localauth_plugin
    dest: /usr/local/etc/krb5.conf.d/localauth_plugin
    mode: "0644"
    owner: root
    group: wheel

- name: "Configure kerberos"
  ansible.builtin.template:
    src: krb5.conf.j2
    dest: /etc/krb5.conf
    mode: "0644"
    owner: root
    group: wheel

# --- SSSD ---

- name: "Configure SSSD"
  ansible.builtin.template:
    src: sssd.conf.j2
    dest: /usr/local/etc/sssd/sssd.conf
    mode: "0600"
    owner: root
    group: wheel
  notify: restart-sssd

# --- NSS and LDAP ---

- name: "Configure nsswitch"
  ansible.builtin.copy:
    src: nsswitch.conf
    dest: /etc/nsswitch.conf
    mode: "0644"
    owner: root
    group: wheel

- name: "Configure OpenLDAP"
  ansible.builtin.template:
    src: ldap.conf.j2
    dest: /usr/local/etc/openldap/ldap.conf
    mode: "0644"
    owner: root
    group: wheel

# --- PAM ---

- name: "Configure PAM for sshd"
  ansible.builtin.copy:
    src: pam_sshd
    dest: /etc/pam.d/sshd
    mode: "0644"
    owner: root
    group: wheel

# --- SSH ---

- name: "Write SSH CA public key"
  ansible.builtin.copy:
    content: "{{ ssh_ca }}"
    dest: "/etc/ssh/trusted-CA.pem"
    owner: "root"
    group: "wheel"
    mode: "0644"
  notify: restart-sshd

- name: "Ensure TrustedUserCAKeys is set in sshd_config"
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?TrustedUserCAKeys"
    line: "TrustedUserCAKeys /etc/ssh/trusted-CA.pem"
    state: present
    validate: "/usr/sbin/sshd -T -f %s"
  notify: restart-sshd

- name: "Ensure PubkeyAuthentication is enabled in sshd_config"
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PubkeyAuthentication"
    line: "PubkeyAuthentication yes"
    state: present
    validate: "/usr/sbin/sshd -T -f %s"
  notify: restart-sshd

- name: "Ensure PermitRootLogin is prohibit-password in sshd_config"
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PermitRootLogin"
    line: "PermitRootLogin prohibit-password"
    state: present
    validate: "/usr/sbin/sshd -T -f %s"
  notify: restart-sshd

# --- Services ---

- name: "Enable dbus in rc.conf"
  community.general.sysrc:
    name: dbus_enable
    value: "YES"

- name: "Start dbus"
  ansible.builtin.service:
    name: dbus
    state: started
    enabled: true

- name: "Enable sssd in rc.conf"
  community.general.sysrc:
    name: sssd_enable
    value: "YES"

- name: "Start sssd"
  ansible.builtin.service:
    name: sssd
    state: started
    enabled: true

# --- Sudo ---

- name: "Configure passwordless sudo for wheel group"
  ansible.builtin.copy:
    content: "%wheel ALL=(ALL) NOPASSWD: ALL\n"
    dest: "/usr/local/etc/sudoers.d/wheel"
    owner: "root"
    group: "wheel"
    mode: "0440"
    validate: "/usr/local/sbin/visudo -cf %s"
