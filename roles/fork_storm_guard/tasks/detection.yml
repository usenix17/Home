---
# Part 3: detection via netdata health alarms (D-state, total procs, swap).
# Extends the already-deployed netdata rather than adding a new mechanism, and
# reuses its existing collection so no extra proc sweep is introduced. Routes to
# the existing PagerDuty path.

- name: "Ensure the netdata health.d directory exists"
  ansible.builtin.file:
    path: "{{ fork_storm_guard_netdata_health_dir }}"
    state: directory
    owner: root
    group: wheel
    mode: "0755"

- name: "Install the fork-storm netdata health alarms"
  ansible.builtin.template:
    src: forkstorm.health.conf.j2
    dest: "{{ fork_storm_guard_netdata_health_dir }}/forkstorm.conf"
    owner: root
    group: wheel
    mode: "0644"
  notify: "reload-netdata-health"

# PagerDuty delivery rides netdata's health_alarm_notify.conf (shipped by the
# pagerduty role). On FreeBSD that file lives under /usr/local/etc/netdata,
# whereas the pagerduty role writes /etc/netdata (Linux) -- so PD routing may be
# absent here. Warn, do NOT fail: the alarms still fire locally and via the
# Wazuh syslog path even without PD.
- name: "Check netdata PagerDuty routing is present"
  ansible.builtin.command: >-
    grep -c '^SEND_PD="YES"' {{ fork_storm_guard_netdata_notify_conf }}
  register: fsg_pd
  changed_when: false
  failed_when: false
  check_mode: false

- name: "Surface a PagerDuty routing gap"
  ansible.builtin.debug:
    msg: >-
      netdata PagerDuty routing not confirmed in
      {{ fork_storm_guard_netdata_notify_conf }} (SEND_PD="YES" not found).
      The fork-storm alarms still fire locally and via the Wazuh syslog path,
      but will NOT page PagerDuty until the pagerduty role's
      health_alarm_notify.conf is present at this FreeBSD path with
      SEND_PD="YES" and DEFAULT_RECIPIENT_PD set. See README.
  when: (fsg_pd.stdout | default('0') | int) < 1
