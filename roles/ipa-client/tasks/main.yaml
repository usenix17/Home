---

- name: "Get kerberos ticket"
  ansible.builtin.expect:
    command: kinit admin
    responses:
      'Password for admin@STARNIX.NET:': "{{ become_pass }}\n"
  delegate_to: localhost

- name: "Ensure host is present"
  ansible.builtin.shell: "ipa host-add {{ inventory_hostname }}"
  register: ipa_result
  failed_when: ipa_result.rc != 0 and "already exists" not in ipa_result.stderr
  changed_when: ipa_result.rc == 0
  delegate_to: localhost

- name: "Get current kerberos keytab"
  ansible.builtin.shell: "ipa-getkeytab -s {{ ipa_server }} -p host/{{ inventory_hostname }} -k /dev/shm/{{ inventory_hostname }}.keytab"
  delegate_to: localhost

- name: "Update permissions on keytab"
  ansible.builtin.file:
    path: "/dev/shm/{{ inventory_hostname }}.keytab"
    mode: "0600"
    owner: root
    group: root
  delegate_to: localhost

- name: "Copy keytab from localhost"
  ansible.builtin.copy:
    src: "/dev/shm/{{ inventory_hostname }}.keytab"
    dest: "/etc/krb5.keytab"
    mode: "0600"
    owner: root
    group: root

- name: "Clean up keytab from localhost"
  ansible.builtin.file:
    path: "/dev/shm/{{ inventory_hostname }}.keytab"
    state: absent
  delegate_to: localhost

- name: "Create /var/lib/ipa-client/pki/ directory"
  ansible.builtin.file:
    path: "/var/lib/ipa-client/pki"
    state: directory
    mode: "0755"
    owner: root
    group: root

- name: "Copy kdc ca certs"
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/var/lib/ipa-client/pki/"
    mode: "0644"
    owner: root
    group: root
  loop:
    - "ca-bundle.pem"
    - "kdc-ca-bundle.pem"

- name: "Create sssd kerberos directory structure"
  ansible.builtin.file:
    path: "/var/lib/sss/pubconf/krb5.include.d/"
    state: directory
    mode: "0755"

- name: "Copy additional kerberos configs"
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/var/lib/sss/pubconf/krb5.include.d/"
    mode: "0644"
    owner: root
    group: root
  loop:
    - domain_realm_starnix_net
    - krb5_libdefaults
    - localauth_plugin

- name: "Create kerberos directory structure"
  ansible.builtin.file:
    path: "/etc/krb5.conf.d/"
    state: directory
    mode: "0755"

- name: "Copy freeipa kerberos config"
  ansible.builtin.copy:
    src: "freeipa"
    dest: "/etc/krb5.conf.d/"
    mode: "0644"
    owner: root
    group: root

- name: "Create /etc/ipa directory"
  ansible.builtin.file:
    path: "/etc/ipa"
    state: directory
    mode: "0755"

- name: "Create /etc/sssd directory"
  ansible.builtin.file:
    path: "/etc/sssd"
    state: directory
    mode: "0755"
    owner: root
    group: root

- name: "Configure nsswitch"
  ansible.builtin.copy:
    src: "nsswitch.conf"
    dest: "/etc/nsswitch.conf"
    mode: "0644"
    owner: root
    group: root

- name: "Configure OpenLDAP"
  ansible.builtin.template:
    src: "ldap.conf.j2"
    dest: "/etc/openldap/ldap.conf"
    mode: "0644"
    owner: root
    group: root

- name: "Configure kerberos"
  ansible.builtin.template:
    src: "krb5.conf.j2"
    dest: "/etc/krb5.conf"
    mode: "0644"
    owner: root
    group: root

- name: "Configure sssd"
  ansible.builtin.template:
    src: "sssd.conf.j2"
    dest: "/etc/sssd/sssd.conf"
    mode: "0600"
    owner: root
    group: root
  notify: restart-sssd

- name: "Configure ssh"
  ansible.builtin.copy:
    src: "sshd_config"
    dest: "/etc/ssh/sshd_config"
    mode: "0644"
    owner: root
    group: root
  notify: restart-ssh

- name: "Configure PAM"
  ansible.builtin.copy:
    src: "system-auth"
    dest: "/etc/pam.d/system-auth"
    mode: "0644"
    owner: root
    group: root
  notify: restart-sssd

- name: "Fetch IPA CA certificate from IPA server"
  ansible.builtin.get_url:
    url: http://{{ ipa_server }}/ipa/config/ca.crt
    dest: /etc/ssl/certs/starnix-ipa-ca.crt
    mode: "0644"
    owner: root
    group: root
  notify: update-ca-trust

- name: "Install IPA CA cert into system trust store"
  ansible.builtin.copy:
    src: /etc/ssl/certs/starnix-ipa-ca.crt
    dest: /etc/ca-certificates/trust-source/anchors/starnix-ipa-ca.crt
    remote_src: true
    mode: "0644"
    owner: root
    group: root
  notify: update-ca-trust

- name: "Copy IPA CA cert to /etc/ipa/ca.crt"
  ansible.builtin.copy:
    src: /etc/ssl/certs/starnix-ipa-ca.crt
    dest: /etc/ipa/ca.crt
    remote_src: true
    mode: "0644"
    owner: root
    group: root

- name: "Configure WPA2-Enterprise WiFi connection for Osa_nomap"
  community.general.nmcli:
    conn_name: Osa_nomap
    type: wifi
    ssid: Osa_nomap
    wifi_sec:
      key-mgmt: wpa-eap
      eap: peap
      phase2-auth: mschapv2
      ca-cert: /etc/ssl/certs/starnix-ipa-ca.crt
      domain-suffix-match: "{{ ipa_server }}"
      identity: "{{ ansible_user }}"
    state: present
