---
- name: "Restart mongod in jail"
  ansible.builtin.command: "bastille service {{ graylog_jail_name }} mongod restart"
  changed_when: true

- name: "Restart opensearch in jail"
  ansible.builtin.command: "bastille service {{ graylog_jail_name }} opensearch restart"
  changed_when: true

- name: "Restart graylog in jail"
  ansible.builtin.command: "bastille service {{ graylog_jail_name }} graylog restart"
  changed_when: true
