---
# UniFi controller base URL (no trailing /api).
unifi_api_url: "https://192.168.1.1"

# Dry-run by default; the Semaphore template overrides this to true to enforce.
unifi_fw_apply: false

# Abort a prune that would delete more than this many iac-tagged rules
# (guards against an empty/broken desired file wiping the firewall).
unifi_fw_max_prune: 10
