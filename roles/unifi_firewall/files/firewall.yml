# UniFi zone-firewall desired state (reconciled by files/reconcile.py).
# Managed rules are tagged iac:<key> on the controller (stateless);
# ordering is left to the UDM. Codified from the Terraform baseline
# plus the internal-DNS consolidation and a disabled Roblox block.

