# Suricata NSM logs are shipped live to Wazuh + Graylog, so on-disk history is
# just a buffer -- rotate aggressively on size. SIGHUP makes Suricata reopen its
# log files after rotation.
# logfilename                owner:group  mode count  size(KB) when flags pidfile              sig
/var/log/suricata/eve.json   root:wheel   644   4     2097152  *    ZC   /var/run/suricata.pid  1
/var/log/suricata/fast.log   root:wheel   644   3     1048576  *    ZC   /var/run/suricata.pid  1
/var/log/suricata/stats.log  root:wheel   644   3      262144  *    ZC   /var/run/suricata.pid  1
