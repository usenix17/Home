---
# Read-only AI alert-triage jail (Bastille, VNET) on beastyboi: the Linux
# Claude Code build under linuxulator, plus the read-only CLIs and wrappers
# it may call. See README.md.

triage_jail_name: "triage"
triage_jail_ip: "192.168.1.61"
triage_jail_cidr: "24"
triage_jail_gateway: "192.168.1.1"

triage_release: "{{ bastille_release | default('15.1-RELEASE') }}"
triage_jail_dir: "{{ bastille_prefix | default('/usr/local/bastille') }}/jails/{{ triage_jail_name }}"
triage_jail_root: "{{ triage_jail_dir }}/root"

# FreeBSD packages inside the jail. Approved 2026-11-23 at linux_base-rl9
# 9.8_1, kubectl 1.37.1_3, python311 3.11.18, doas 6.4_1 (plus their deps).
triage_packages:
  - linux_base-rl9
  - kubectl
  - python311
  - doas
triage_python: "/usr/local/bin/python3.11"

# Pinned binaries; bump version and checksum together. Claude Code has no
# approved checksum file, so its sha256 is pinned from the approved download.
triage_claude_version: "2.1.312"
triage_claude_url: "https://downloads.claude.ai/claude-code-releases/{{ triage_claude_version }}/linux-x64/claude"
triage_claude_size: 293592432
triage_claude_sha256: "4f4178ce41d83e23341ebfbaecdbcf8ea6bf7baea0690025abe49eeec3a5d01d"

triage_talosctl_version: "v1.14.5"
triage_talosctl_url: "https://github.com/siderolabs/talos/releases/download/{{ triage_talosctl_version }}/talosctl-freebsd-amd64"
triage_talosctl_sha256: "6657416d2160d15c1cf015c545228a317595b90b7bd8a63786d4dfb9f75691ee"

# Install layout (jail paths). The wrappers in bin/ import the package from
# their grandparent dir, so lib/triage/{triage,bin} must stay siblings.
triage_lib_dir: "/usr/local/lib/triage"
triage_claude_dir: "{{ triage_lib_dir }}/claude"
triage_claude_bin: "{{ triage_claude_dir }}/claude"
triage_talosctl_bin: "/usr/local/bin/talosctl"

# Claude Code managed settings: root-owned, outrank user/project settings.
# Linux path /etc/claude-code; the jail path below is what the Linux binary
# sees there under linuxulator. The permission rules live here too, so the
# agent can't add an allow rule (managed-only rules, no bypass mode).
triage_claude_managed_dir: "/compat/linux/etc/claude-code"
triage_claude_managed_settings:
  env:
    DISABLE_AUTOUPDATER: "1"
    DISABLE_UPDATES: "1"
    CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    DISABLE_TELEMETRY: "1"
    DISABLE_ERROR_REPORTING: "1"
  allowManagedPermissionRulesOnly: true
  allowManagedHooksOnly: true
  # No MCP servers at all, and only managed settings may say otherwise.
  allowedMcpServers: []
  allowManagedMcpServersOnly: true
  enableAllProjectMcpServers: false
  permissions:
    defaultMode: "dontAsk"
    disableBypassPermissionsMode: "disable"
    allow: "{{ triage_claude_allow }}"
    deny: "{{ triage_claude_deny }}"

# Only the wrappers: they fix the endpoint and credential and allowlist the
# arguments. Raw kubectl and talosctl are denied. Anything not allowed is
# denied (dontAsk).
triage_claude_allow:
  - "Bash(triage-kubectl *)"
  - "Bash(triage-talosctl *)"
  - "Bash(triage-promql *)"
  - "Bash(triage-graylog *)"
  - "Bash(triage-gatus*)"
  - "Read"
  - "Grep"
  - "Glob"

# Deny wins over allow. The Read denies also fence Claude Code's built-in
# read-only shell tools (cat, wc, ls) away from credentials and /proc.
triage_claude_deny:
  - "Edit"
  - "Write"
  - "NotebookEdit"
  - "WebFetch"
  - "WebSearch"
  - "Bash(curl *)"
  - "Bash(wget *)"
  - "Bash(fetch *)"
  - "Bash(nc *)"
  - "Bash(ssh *)"
  - "Bash(scp *)"
  - "Bash(doas *)"
  - "Bash(kubectl)"
  - "Bash(kubectl *)"
  - "Bash(talosctl)"
  - "Bash(talosctl *)"
  # Anything that lists environments or other processes: Claude's own
  # environment holds the OAuth token, and it runs as this uid.
  - "Bash(ps)"
  - "Bash(ps *)"
  - "Bash(procstat)"
  - "Bash(procstat *)"
  - "Bash(pgrep)"
  - "Bash(pgrep *)"
  - "Bash(pkill)"
  - "Bash(pkill *)"
  - "Bash(top)"
  - "Bash(top *)"
  - "Bash(w)"
  - "Bash(w *)"
  - "Bash(pwdx)"
  - "Bash(pwdx *)"
  - "Bash(fuser)"
  - "Bash(fuser *)"
  - "Bash(fstat)"
  - "Bash(fstat *)"
  - "Bash(sockstat)"
  - "Bash(sockstat *)"
  - "Bash(systat)"
  - "Bash(systat *)"
  - "Bash(truss)"
  - "Bash(truss *)"
  - "Bash(ktrace)"
  - "Bash(ktrace *)"
  - "Bash(kdump)"
  - "Bash(kdump *)"
  - "Bash(gcore)"
  - "Bash(gcore *)"
  - "Bash(lldb)"
  - "Bash(lldb *)"
  - "Bash(dtrace)"
  - "Bash(dtrace *)"
  - "Bash(lastcomm)"
  - "Bash(lastcomm *)"
  - "Bash(sysctl)"
  - "Bash(sysctl *)"
  - "Bash(env)"
  - "Bash(env *)"
  - "Bash(printenv)"
  - "Bash(printenv *)"
  - "Bash(kenv)"
  - "Bash(kenv *)"
  - "Bash(set)"
  - "Bash(set *)"
  - "Bash(export)"
  - "Bash(export *)"
  - "Bash(declare)"
  - "Bash(declare *)"
  - "Bash(typeset)"
  - "Bash(typeset *)"
  - "Read(/{{ triage_etc_dir }}/**)"
  - "Read(/{{ triage_agent_etc_dir }}/**)"
  - "Read(/{{ triage_home }}/**)"
  - "Read(/{{ triage_agent_home }}/.claude/**)"
  - "Read(/{{ triage_agent_home }}/.claude.json)"
  - "Read(/{{ triage_agent_home }}/.kube/**)"
  - "Read(//usr/local/etc/doas.conf)"
  - "Read(//proc/**)"
  - "Read(//compat/linux/proc/**)"

# PATH for the Linux shell Claude Code's Bash tool spawns.
triage_path: "{{ triage_lib_dir }}/bin:/usr/local/bin:/usr/bin:/bin"

triage_user: "triage"
triage_uid: 1061
triage_home: "/var/db/triage"
triage_log_dir: "/var/log/triage"
triage_etc_dir: "/usr/local/etc/triage"

# Linux ABI filesystems, mounted from the host via the jail's fstab so the
# jail needs no allow.mount* parameters. No devfs at /compat/linux/dev:
# Linux lookups fall back to the jail's own /dev (README "Why no devfs").
triage_linux_mounts:
  - { src: "fdescfs", path: "/compat/linux/dev/fd", fstype: "fdescfs", opts: "rw,linrdlnk" }
  - { src: "tmpfs", path: "/compat/linux/dev/shm", fstype: "tmpfs", opts: "rw,mode=1777,size=256m" }
  - { src: "linprocfs", path: "/compat/linux/proc", fstype: "linprocfs", opts: "rw" }
  - { src: "linsysfs", path: "/compat/linux/sys", fstype: "linsysfs", opts: "rw" }

# --- Receiver (Task 8) ---------------------------------------------------------
triage_port: 8090
triage_state_dir: "{{ triage_home }}/state"
triage_schema_path: "{{ triage_lib_dir }}/schema.json"
triage_config_path: "{{ triage_etc_dir }}/config.json"
triage_token_path: "{{ triage_etc_dir }}/claude.token"
# Kubeconfig default only: triage-kubectl picks a reachable server.
triage_kube_server: "https://192.168.7.202:6443"
triage_lang: "C.UTF-8"
triage_pidfile: "/var/run/triage.pid"
triage_receiver_log: "{{ triage_log_dir }}/receiver.log"
triage_run_log_days: 30
triage_transcript_days: 30
triage_model: null
triage_max_turns: 25
triage_timeout_s: 600
triage_batch_window_s: 120
triage_dedupe_s: 21600
triage_daily_cap: 10
triage_queue_max: 5
triage_token_lifetime_days: 365
triage_warn_days: 30
# Required at run time, never committed: vault_triage_claude_token,
# vault_triage_push_token, vault_triage_discord_webhook,
# vault_triage_kube_token, vault_triage_kube_ca (PEM),
# vault_triage_omni_key, vault_triage_graylog_token, and
# triage_token_created (date part of cluster/triage-claude updated_time).

# --- Agent uid (R14) -----------------------------------------------------------
# The receiver (triage) holds the secrets; Claude and its tools run as
# triage-agent via doas, so they can't read them.
triage_agent_user: "triage-agent"
triage_agent_uid: 1062
triage_agent_home: "/var/db/triage-agent"
triage_agent_workdir: "{{ triage_agent_home }}/work"
triage_agent_etc_dir: "/usr/local/etc/triage-agent"
triage_agent_kubeconfig: "{{ triage_agent_etc_dir }}/kubeconfig"
triage_agent_talosconfig: "{{ triage_agent_etc_dir }}/talosconfig"
triage_agent_omni_key: "{{ triage_agent_etc_dir }}/omni.key"
triage_agent_graylog_token: "{{ triage_agent_etc_dir }}/graylog.token"
# Talos API through Omni, as a Reader service account.
triage_omni_endpoint: ""
triage_omni_cluster: ""
triage_omni_identity: "triage-agent@serviceaccount.omni.sidero.dev"
triage_agent_launcher: "{{ triage_lib_dir }}/libexec/triage-agent-run"
triage_doas: "/usr/local/bin/doas"
# The launcher's own hard timeout, under the receiver's so it fires first.
triage_agent_timeout_s: "{{ triage_timeout_s - 15 }}"

# --- Jail egress (R14) ---------------------------------------------------------
# pf inside the VNET jail needs /dev/pf: devfs ruleset 14 (bastille_net), from
# roles/bastille with bastille_devfs_net_ruleset (fix/bastille-devfs).
triage_devfs_ruleset: 14
# R15 (owner, 2026-11-23): boot at 1 so pf can load, rc raises it to 2.
triage_jail_boot_securelevel: 1
triage_jail_securelevel: 2
# Anthropic API inbound ranges, from
# https://platform.claude.com/docs/en/api/ip-addresses (checked 2026-11-23).
triage_anthropic_api_v4: ["160.79.104.0/23", "153.61.224.0/22"]
triage_anthropic_api_v6: ["2607:6bc0::/48"]
# Tool endpoints for triage-agent: k8s API, Prometheus via Traefik,
# watcher Gatus, Graylog, and Omni (R18, by IP: fails closed if it moves).
triage_agent_egress:
  - { to: "192.168.7.202", port: 6443 }
  - { to: "192.168.7.203", port: 6443 }
  - { to: "192.168.7.204", port: 6443 }
  - { to: "192.168.7.207", port: 443 }
  - { to: "192.168.1.60", port: 8080 }
  - { to: "192.168.1.151", port: 9000 }
  - { to: "{{ triage_omni_ip }}", port: 443 }
# Who may reach the receiver: the LAN (watcher) and the cluster nodes.
triage_ingress_from: ["192.168.1.0/24", "192.168.7.0/24"]
