---
# ZFS maintenance for the FreeBSD storage host (mimir): fault daemon, periodic
# scrubs, and sanoid snapshots. Reproduces what TrueNAS did automatically before
# the migration to vanilla FreeBSD 15 (all three are silent-failure gaps -- a
# missing scrub or unmonitored fault goes unnoticed until data loss).

# --- zfsd: fault-management daemon -------------------------------------------
- name: "Enable and start zfsd (fault handling / hot-spare activation)"
  when: zfs_zfsd_enable | bool
  block:
    - name: "Enable zfsd in rc.conf"
      community.general.sysrc:
        name: zfsd_enable
        value: "YES"

    - name: "Ensure zfsd is running"
      ansible.builtin.service:
        name: zfsd
        state: started

# --- Periodic ZFS scrub ------------------------------------------------------
# FreeBSD's daily periodic(8) run scrubs any pool not scrubbed in > threshold
# days. Written to /etc/periodic.conf, not /etc/rc.conf.
- name: "Enable the daily ZFS scrub (periodic.conf)"
  when: zfs_scrub_enable | bool
  block:
    - name: "daily_scrub_zfs_enable=YES in /etc/periodic.conf"
      community.general.sysrc:
        name: daily_scrub_zfs_enable
        value: "YES"
        path: /etc/periodic.conf

    - name: "Set the scrub age threshold (days)"
      community.general.sysrc:
        name: daily_scrub_zfs_default_threshold
        value: "{{ zfs_scrub_threshold_days | string }}"
        path: /etc/periodic.conf

# --- sanoid: snapshots + pruning ---------------------------------------------
# This role owns sanoid install + sanoid.conf ONLY. Scheduling moved to the
# fork_storm_guard role, which runs sanoid through a lockf wrapper so a hung
# `zfs snapshot` blocks the next run instead of stacking (the 2026-08-14
# fork-storm). Two roles must not both manage that /etc/crontab line, so it
# lives there -- see playbooks/fork_storm_guard.yml.
- name: "Configure sanoid snapshots"
  when: zfs_sanoid_enable | bool
  block:
    - name: "Install sanoid"
      community.general.pkgng:
        name: sanoid
        state: present

    - name: "Write sanoid.conf"
      ansible.builtin.template:
        src: sanoid.conf.j2
        dest: /usr/local/etc/sanoid/sanoid.conf
        owner: root
        group: wheel
        mode: "0644"

# --- NFS exports (ZFS sharenfs) ----------------------------------------------
# Manage exports natively via the sharenfs property (writes /etc/zfs/exports,
# which mountd reads) instead of hand-editing /etc/exports. Only datasets listed
# in zfs_sharenfs are touched; the legacy TrueNAS-era shares are left as-is.
- name: "Export data pools via ZFS sharenfs"
  when: zfs_sharenfs | length > 0
  community.general.zfs:
    name: "{{ item.key }}"
    state: present
    extra_zfs_properties:
      sharenfs: "{{ item.value }}"
  loop: "{{ zfs_sharenfs | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
