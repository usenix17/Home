---

- name: "Configure pacman for Color output"
  ansible.builtin.lineinfile:
    path: /etc/pacman.conf
    regexp: '^#?Color'
    line: 'Color'

- name: "Configure pacman ILoveCandy option"
  ansible.builtin.lineinfile:
    path: /etc/pacman.conf
    regexp: '^#?ILoveCandy'
    line: 'ILoveCandy'
    insertafter: '^Color'

- name: "Enable multilib repository"
  ansible.builtin.blockinfile:
    path: /etc/pacman.conf
    block: |
      [multilib]
      Include = /etc/pacman.d/mirrorlist
    marker: "# {mark} ANSIBLE MANAGED BLOCK - multilib"

- name: "Install git and base-devel"
  community.general.pacman:
    name:
      - base-devel
      - git
    state: latest
    update_cache: false

- name: "Add {{ arch_aur_user }} to wheel group"
  ansible.builtin.user:
    name: "{{ arch_aur_user }}"
    groups: wheel
    append: yes

- name: "Configure passwordless sudo for wheel group"
  ansible.builtin.lineinfile:
    path: /etc/sudoers
    regexp: '^%wheel ALL=\(ALL:ALL\) ALL'
    line: '%wheel ALL=(ALL:ALL) NOPASSWD: ALL'
    validate: 'visudo -cf %s'

- name: "Clone the yay git repo"
  ansible.builtin.git:
    repo: "https://aur.archlinux.org/yay.git"
    dest: "/opt/yay"
  failed_when: false
  changed_when: false
  tags: ["never", "yay"]

- name: "Change ownership of /opt/yay to {{ arch_aur_user }}"
  ansible.builtin.file:
    path: "/opt/yay"
    owner: "{{ arch_aur_user }}"
    group: "{{ arch_aur_user }}"
    recurse: yes
  tags: ["never", "yay"]

- name: "Check if yay is already installed"
  ansible.builtin.command: which yay
  register: yay_check
  changed_when: false
  failed_when: false
  tags: ["never", "yay"]

- name: "Build yay from source"
  ansible.builtin.shell:
    cmd: "sudo -u {{ arch_aur_user }} makepkg -si --noconfirm"
    chdir: "/opt/yay"
  when: yay_check.rc != 0
  tags: ["never", "yay"]

- name: "Create symlink for yay in /usr/local/bin"
  ansible.builtin.file:
    src: "/usr/bin/yay"
    dest: "/usr/local/bin/yay"
    state: link
  tags: ["never", "yay"]

