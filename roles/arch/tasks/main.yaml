- name: "Deploy kernel-purge script"
  ansible.builtin.copy:
    dest: /usr/local/bin/kernel-purge
    content: |
      #!/bin/bash
      # Keep the N most recent /usr/lib/modules/ directories per kernel variant.
      # Variants are detected by suffix: *-zen → zen, *-arch* → arch, else → other.
      set -euo pipefail

      KEEP=${1:-2}
      MODULES=/usr/lib/modules

      declare -A count=()

      while IFS= read -r name; do
          if   [[ $name =~ -zen$  ]]; then v=zen
          elif [[ $name =~ -arch  ]]; then v=arch
          else                              v=other
          fi
          count[$v]=$(( ${count[$v]:-0} + 1 ))
          if (( ${count[$v]} > KEEP )); then
              echo "kernel-purge: removing $MODULES/$name"
              rm -rf "$MODULES/$name"
          fi
      done < <(ls "$MODULES" | sort -Vr)
    owner: root
    group: root
    mode: "0755"

- name: "Create pacman hooks directory"
  ansible.builtin.file:
    path: /etc/pacman.d/hooks
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "Deploy kernel-purge pacman hook"
  ansible.builtin.template:
    src: kernel-purge.hook
    dest: /etc/pacman.d/hooks/kernel-purge.hook
    owner: root
    group: root
    mode: "0644"

- name: "Run kernel-purge to clean up accumulated old kernel module directories"
  ansible.builtin.command: /usr/local/bin/kernel-purge 2
  changed_when: true

- name: "Create NFS mount directories"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /Backup
    - /kronos
    - /Comet

- name: "Add NFS mounts to /etc/fstab"
  ansible.builtin.blockinfile:
    path: /etc/fstab
    marker: "# {mark} ANSIBLE MANAGED BLOCK - NFS"
    block: |
      mimir.starnix.net:/mnt/Backup  /Backup   nfs     nfsvers=4,soft,rsize=262144,wsize=262144,intr,noatime,lock,user,users,_netdev,noauto,x-systemd.automount,exec 0 0
      mimir.starnix.net:/mnt/Store   /kronos   nfs     nfsvers=4,soft,rsize=262144,wsize=262144,intr,noatime,lock,user,users,_netdev,noauto,x-systemd.automount,exec 0 0
      mimir.starnix.net:/mnt/Comet   /Comet    nfs     nfsvers=4,soft,rsize=262144,wsize=262144,intr,noatime,lock,user,users,_netdev,noauto,x-systemd.automount,exec 0 0

- name: "Fetch IPA CA certificate into system trust store"
  ansible.builtin.get_url:
    url: http://ipa1.starnix.net/ipa/config/ca.crt
    dest: /etc/ca-certificates/trust-source/anchors/starnix-ipa-ca.crt
    mode: "0644"
    owner: root
    group: root
  notify: update-ca-trust

- name: "Deploy sssd.conf"
  ansible.builtin.template:
    src: sssd.conf.j2
    dest: /etc/sssd/sssd.conf
    owner: root
    group: sssd
    mode: "0600"
  notify: restart-sssd

- name: "Create sssd.service drop-in directory"
  ansible.builtin.file:
    path: /etc/systemd/system/sssd.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "Deploy sssd.service drop-in to start sssd-kcm eagerly"
  ansible.builtin.template:
    src: sssd-kcm-eager.conf.j2
    dest: /etc/systemd/system/sssd.service.d/kcm.conf
    owner: root
    group: root
    mode: "0644"
  notify: daemon-reload

- name: "Deploy krb5.conf"
  ansible.builtin.template:
    src: krb5.conf.j2
    dest: /etc/krb5.conf
    owner: root
    group: root
    mode: "0644"

- name: "Fix krb5 keytab permissions so sssd can read it"
  ansible.builtin.file:
    path: /etc/krb5.keytab
    owner: root
    group: sssd
    mode: "0640"

- name: "Deploy NVIDIA S0ix power management modprobe config"
  ansible.builtin.template:
    src: nvidia-power.conf.j2
    dest: /etc/modprobe.d/nvidia-power.conf
    owner: root
    group: root
    mode: "0644"
  notify: rebuild-initramfs

- name: "Enable NVIDIA suspend/resume/hibernate systemd services"
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
  loop:
    - nvidia-suspend.service
    - nvidia-resume.service
    - nvidia-hibernate.service

- name: "Add resume hook to mkinitcpio after encrypt"
  ansible.builtin.lineinfile:
    path: /etc/mkinitcpio.conf
    regexp: '^HOOKS=\(.*encrypt filesystems.*\)'
    line: 'HOOKS=(base udev autodetect kms microcode modconf keyboard keymap consolefont block encrypt resume filesystems fsck)'
  notify: rebuild-initramfs

- name: "Get swapfile physical offset for hibernate resume"
  ansible.builtin.shell:
    cmd: "filefrag -v /swapfile | awk 'NR==4 {gsub(/\\.\\..*/,\"\",$4); print $4}'"
  register: arch_swapfile_offset
  changed_when: false

- name: "Get root filesystem UUID for hibernate resume"
  ansible.builtin.shell:
    cmd: "findmnt -no UUID /"
  register: arch_root_uuid
  changed_when: false

- name: "Check if GRUB already has correct hibernate resume parameters"
  ansible.builtin.command:
    cmd: "grep -qF 'resume=UUID={{ arch_root_uuid.stdout }} resume_offset={{ arch_swapfile_offset.stdout }}' /etc/default/grub"
  register: arch_grub_has_resume
  changed_when: false
  failed_when: false

- name: "Add i915.enable_dc=0 to GRUB cmdline to prevent i915 from requesting DC6 (gates C10 PHY immediately)"
  ansible.builtin.replace:
    path: /etc/default/grub
    regexp: '^(GRUB_CMDLINE_LINUX_DEFAULT="(?:(?!i915\.enable_dc)[^"])*)(")'
    replace: '\1 i915.enable_dc=0\2'
  notify: rebuild-grub

- name: "Add i915.enable_psr=0 to GRUB cmdline to prevent PSR from gating C10 PHY refclk during sleep"
  ansible.builtin.replace:
    path: /etc/default/grub
    regexp: '^(GRUB_CMDLINE_LINUX_DEFAULT="(?:(?!i915\.enable_psr)[^"])*)(")'
    replace: '\1 i915.enable_psr=0\2'
  notify: rebuild-grub

- name: "Add intel_idle.max_cstate=6 to GRUB cmdline to prevent deep package C-states gating display PHY"
  ansible.builtin.replace:
    path: /etc/default/grub
    regexp: '^(GRUB_CMDLINE_LINUX_DEFAULT="(?:(?!intel_idle\.max_cstate)[^"])*)(")'
    replace: '\1 intel_idle.max_cstate=6\2'
  notify: rebuild-grub

- name: "Add acpi_sleep=nonvs to GRUB cmdline to skip ACPI NVS save/restore on s2idle"
  ansible.builtin.replace:
    path: /etc/default/grub
    regexp: '^(GRUB_CMDLINE_LINUX_DEFAULT="(?:(?!acpi_sleep)[^"])*)(")'
    replace: '\1 acpi_sleep=nonvs\2'
  notify: rebuild-grub

- name: "Strip stale resume parameters from GRUB cmdline"
  ansible.builtin.replace:
    path: /etc/default/grub
    regexp: '\s+resume=\S+|\s+resume_offset=\S+'
    replace: ''
  when: arch_grub_has_resume.rc != 0

- name: "Add hibernate resume parameters to GRUB cmdline"
  ansible.builtin.replace:
    path: /etc/default/grub
    regexp: '^(GRUB_CMDLINE_LINUX_DEFAULT="[^"]*)"$'
    replace: '\1 resume=UUID={{ arch_root_uuid.stdout }} resume_offset={{ arch_swapfile_offset.stdout }}"'
  when: arch_grub_has_resume.rc != 0
  notify: rebuild-grub

- name: "Deploy SDDM PAM config with KWallet auto-unlock"
  ansible.builtin.template:
    src: sddm-pam.j2
    dest: /etc/pam.d/sddm
    owner: root
    group: root
    mode: "0644"

- name: "Create SDDM systemd drop-in directory"
  ansible.builtin.file:
    path: /etc/systemd/system/sddm.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "Deploy SDDM drop-in to start after SSSD"
  ansible.builtin.template:
    src: sddm-sssd.conf.j2
    dest: /etc/systemd/system/sddm.service.d/sssd.conf
    owner: root
    group: root
    mode: "0644"
  notify: daemon-reload

- name: "Disable SDDM last-user display to avoid overflow UID at boot"
  ansible.builtin.template:
    src: sddm-lastuser.conf.j2
    dest: /etc/sddm.conf.d/sssd-lastuser.conf
    owner: root
    group: root
    mode: "0644"

- name: "Configure journald to sync to disk every 1 second for better PM event capture"
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/fastsync.conf
    content: |
      [Journal]
      SyncIntervalSec=1
    owner: root
    group: root
    mode: "0644"
  notify: daemon-reload

- name: "Disable iwlwifi power save to prevent Intel BE200 disconnects"
  ansible.builtin.copy:
    dest: /etc/modprobe.d/iwlwifi.conf
    content: |
      options iwlwifi power_save=0
    owner: root
    group: root
    mode: "0644"

- name: "Configure NetworkManager to disable WiFi power save and scan MAC randomization"
  ansible.builtin.copy:
    dest: /etc/NetworkManager/conf.d/wifi-stable.conf
    content: |
      [connection]
      wifi.powersave = 2

      [device]
      wifi.scan-rand-mac-address=no
    owner: root
    group: root
    mode: "0644"
  notify: reload-networkmanager

- name: "Create logind drop-in directory"
  ansible.builtin.file:
    path: /etc/systemd/logind.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "Configure lid close to hibernate directly via logind"
  ansible.builtin.copy:
    dest: /etc/systemd/logind.conf.d/lid.conf
    content: |
      [Login]
      HandleLidSwitch=hibernate
      HandleLidSwitchExternalPower=hibernate
    owner: root
    group: root
    mode: "0644"

- name: "Configure KDE powerdevilrc — disable DPMS/dim for all profiles, hibernate on lid (Plasma 6 format)"
  ansible.builtin.copy:
    dest: "/home/{{ arch_aur_user }}/.config/powerdevilrc"
    content: |
      [AC][Display]
      TurnOffDisplayIdleTimeoutSec=-1
      TurnOffDisplayWhenIdle=false
      DimDisplayIdleTimeoutSec=-1
      DimDisplayWhenIdle=false

      [AC][SuspendAndShutdown]
      AutoSuspendAction=0
      LidAction=0

      [Battery][Display]
      TurnOffDisplayIdleTimeoutSec=-1
      TurnOffDisplayWhenIdle=false
      DimDisplayIdleTimeoutSec=-1
      DimDisplayWhenIdle=false

      [Battery][SuspendAndShutdown]
      AutoSuspendAction=2
      AutoSuspendIdleTimeoutSec=600
      LidAction=0

      [LowBattery][Display]
      TurnOffDisplayIdleTimeoutSec=-1
      TurnOffDisplayWhenIdle=false
      DimDisplayIdleTimeoutSec=-1
      DimDisplayWhenIdle=false

      [LowBattery][SuspendAndShutdown]
      AutoSuspendAction=2
      AutoSuspendIdleTimeoutSec=300
      LidAction=0
    owner: "{{ arch_aur_user }}"
    group: "{{ arch_aur_user }}"
    mode: "0640"
  become: yes
  become_user: "{{ arch_aur_user }}"

- name: "Disable KDE DPMS screen-off in old Plasma 5 format (backwards compat fallback)"
  ansible.builtin.replace:
    path: "/home/{{ arch_aur_user }}/.config/powermanagementprofilesrc"
    regexp: '^(idleTime=)\d+$'
    replace: '\g<1>0'
    after: '^\[(?:AC|Battery|LowBattery)\]\[DPMSControl\]'
  become: yes
  become_user: "{{ arch_aur_user }}"
  failed_when: false

- name: "Enable SSSD KCM socket for persistent Kerberos credential storage"
  ansible.builtin.systemd:
    name: sssd-kcm.socket
    enabled: true
    state: started
