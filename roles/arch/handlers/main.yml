---

- name: update-ca-trust
  ansible.builtin.command: update-ca-trust
  changed_when: false

- name: rebuild-initramfs
  ansible.builtin.command: mkinitcpio -P
  changed_when: false

- name: rebuild-grub
  ansible.builtin.command: grub-mkconfig -o /boot/grub/grub.cfg
  changed_when: false

- name: restart-sssd
  ansible.builtin.systemd:
    name: sssd
    state: restarted

- name: daemon-reload
  ansible.builtin.systemd:
    daemon_reload: true

- name: reload-networkmanager
  ansible.builtin.systemd:
    name: NetworkManager
    state: reloaded

- name: reload-auditd
  ansible.builtin.command: augenrules --load
  changed_when: false

- name: restart-falco
  ansible.builtin.systemd:
    name: falco
    state: restarted

- name: restart-wazuh-agent
  ansible.builtin.systemd:
    name: wazuh-agent
    state: restarted
