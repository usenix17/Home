---
# Network scanner role -- exposes the USB scanner on print.starnix.net to the
# LAN via saned (SANE net) and AirSane (eSCL/AirScan). See playbooks/scanner.yml.

# Client subnets allowed to reach the scanner (used for both saned.conf and the
# AirSane access.conf). Set to allow any client -- the scanner is only reachable
# from the LAN (no WAN port-forward), and clients connect from several VLANs.
scanner_allowed_subnets:
  - 0.0.0.0/0

# AirSane (built from source -- not packaged in Debian).
scanner_airsane_repo: "https://github.com/SimulPiscator/AirSane.git"
scanner_airsane_version: "master"
scanner_airsane_src: "/usr/local/src/AirSane"
scanner_airsane_build: "/usr/local/src/AirSane/build"
scanner_airsane_bin: "/usr/local/bin/airsaned"
scanner_airsane_port: 8090
