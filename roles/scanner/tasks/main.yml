---
# Network scanner on print.starnix.net (Debian): the USB HP LaserJet Pro MFP
# M127fw (SANE hpaio backend) exposed to the LAN two ways --
#   * saned    -- SANE net protocol (Linux clients: scanimage/xsane)
#   * AirSane  -- eSCL/AirScan server, native in macOS/iOS/Windows scan dialogs
# Both share the SANE backend; avahi advertises AirSane over mDNS.

# --- Packages ----------------------------------------------------------------
- name: "Install SANE, HP backend, avahi, and AirSane build deps"
  ansible.builtin.apt:
    name:
      - sane-utils            # scanimage, saned
      - libsane1
      - libsane-hpaio         # HP scanner backend (hpaio)
      - hplip                 # provides hp-plugin (proprietary scan plugin)
      - sane-airscan
      - avahi-daemon          # mDNS advertisement for AirSane
      - avahi-utils           # avahi-browse, for verifying the advertisement
      - acl                   # setfacl, used by the udev rule below
      - git
      - cmake
      - g++
      - libsane-dev
      - libjpeg-dev
      - libpng-dev
      - libavahi-client-dev
      - libusb-1.0-0-dev
    state: present
    update_cache: true

# --- HP proprietary scan plugin ---------------------------------------------
# The HP LaserJet Pro MFP M127fw scanner cannot be OPENED without HP's
# proprietary, version-matched hplip plugin (device listing works, sane_open
# fails with "Error during device I/O", and AirSane then publishes no scanner).
# hp-plugin -i downloads it from HP; feed "d" (download) then a stream of "y"
# for the licence prompt. Idempotent via the state file it writes.
- name: "Install the HP hplip proprietary scan plugin"
  ansible.builtin.shell:
    cmd: '{ echo d; yes 2>/dev/null; } | hp-plugin -i'
    executable: /bin/bash
    creates: /var/lib/hp/hplip.state
  notify: "restart airsaned"

# --- Scanner device access for non-root services ----------------------------
# libsane has a bug where the ACL granting the `scanner` group access to a
# hot-plugged USB scanner is not applied; saned/airsaned (user saned, supp. group
# scanner) would then be denied. Re-apply it from a udev rule (upstream AirSane
# workaround: https://github.com/SimulPiscator/AirSane).
- name: "Install libsane udev ACL rule for the scanner group"
  ansible.builtin.copy:
    dest: /etc/udev/rules.d/65-libsane-acl.rules
    content: |
      ENV{libsane_matched}=="yes", RUN+="/usr/bin/setfacl -m g:scanner:rw $env{DEVNAME}"
    owner: root
    group: root
    mode: "0644"
  notify: "reload udev and retrigger"

# --- saned (SANE net) --------------------------------------------------------
- name: "Configure saned allowed client subnets"
  ansible.builtin.template:
    src: saned.conf.j2
    dest: /etc/sane.d/saned.conf
    owner: root
    group: root
    mode: "0644"
  notify: "restart saned"

- name: "Enable and start saned.socket"
  ansible.builtin.systemd:
    name: saned.socket
    enabled: true
    state: started

# --- AirSane (eSCL/AirScan) build from source --------------------------------
- name: "Clone AirSane source"
  ansible.builtin.git:
    repo: "{{ scanner_airsane_repo }}"
    dest: "{{ scanner_airsane_src }}"
    version: "{{ scanner_airsane_version }}"
  register: scanner_airsane_git

- name: "Check whether airsaned is already built/installed"
  ansible.builtin.stat:
    path: "{{ scanner_airsane_bin }}"
  register: scanner_airsane_stat

- name: "Create AirSane build dir"
  ansible.builtin.file:
    path: "{{ scanner_airsane_build }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# Out-of-tree build; only when the source changed or the binary is missing.
- name: "Build AirSane (cmake + make)"
  ansible.builtin.shell:
    cmd: "cmake {{ scanner_airsane_src }} && make -j{{ ansible_processor_vcpus | default(2) }}"
    chdir: "{{ scanner_airsane_build }}"
    creates: "{{ scanner_airsane_build }}/airsaned"
  when: scanner_airsane_git.changed or not scanner_airsane_stat.stat.exists
  register: scanner_airsane_build_out

- name: "Install the airsaned binary"
  ansible.builtin.copy:
    src: "{{ scanner_airsane_build }}/airsaned"
    dest: "{{ scanner_airsane_bin }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  when: scanner_airsane_git.changed or not scanner_airsane_stat.stat.exists
  notify: "restart airsaned"

# --- AirSane configuration + service (self-contained; no EnvironmentFile) ----
- name: "Create /etc/airsane"
  ansible.builtin.file:
    path: /etc/airsane
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "Template AirSane config files"
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/airsane/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - access.conf
    - options.conf
    - ignore.conf
  notify: "restart airsaned"

- name: "Install the airsaned systemd unit"
  ansible.builtin.template:
    src: airsaned.service.j2
    dest: /etc/systemd/system/airsaned.service
    owner: root
    group: root
    mode: "0644"
  notify: "restart airsaned"

# --- Advertise over IPv4 only ------------------------------------------------
# AirSane announces via avahi and has no per-service address-family switch, so
# make avahi itself IPv4-only: it then publishes A records only (no AAAA).
- name: "Avahi: keep IPv4 enabled"
  ansible.builtin.lineinfile:
    path: /etc/avahi/avahi-daemon.conf
    regexp: '^#?\s*use-ipv4\s*='
    line: "use-ipv4=yes"
    insertafter: '^\[server\]'
  notify: "restart avahi-daemon"

- name: "Avahi: disable IPv6 so the scanner advertises IPv4 only"
  ansible.builtin.lineinfile:
    path: /etc/avahi/avahi-daemon.conf
    regexp: '^#?\s*use-ipv6\s*='
    line: "use-ipv6=no"
    insertafter: '^\[server\]'
  notify:
    - "restart avahi-daemon"
    - "restart airsaned"

- name: "Enable and start airsaned"
  ansible.builtin.systemd:
    name: airsaned
    enabled: true
    state: started
    daemon_reload: true
